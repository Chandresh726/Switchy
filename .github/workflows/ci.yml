name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.23.0
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Detect dead code
        run: pnpm deadcode

  tests-and-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.23.0
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test:run
      - name: Typecheck CLI
        run: pnpm cli:typecheck
      - name: Build CLI
        run: pnpm cli:build

  application-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.23.0
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit all workspace dependencies
        run: pnpm audit
      - name: Build application
        run: pnpm build

  landing:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.23.0
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify landing application
        run: pnpm landing:verify
      - name: Verify demo video
        run: pnpm video:verify

  windows-runtime:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.23.0
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cli:build
      - run: pnpm build
      - run: pnpm runtime:package
        env:
          SWITCHY_TARGET: win32-x64
      - run: node scripts/smoke-runtime.mjs
        env:
          SWITCHY_TARGET: win32-x64
