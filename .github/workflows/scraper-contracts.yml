name: Scraper contracts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: scraper-contracts
  cancel-in-progress: false

jobs:
  check-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.23.0
          run_install: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check bounded public listing contracts
        run: pnpm scraper:check-contracts
